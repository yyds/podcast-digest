name: Trending Digest

on:
  schedule:
    - cron: '10 12 * * *'  # 12:10 UTC = 20:10 Beijing time (10 min after daily digest)
  workflow_dispatch:

jobs:
  trending:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run trending digest
        env:
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          RECIPIENT_EMAIL: ${{ secrets.RECIPIENT_EMAIL }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: python main_trending.py

      - name: Save state files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add processed_github_trending.json processed_hn.json 2>/dev/null || true
          git diff --cached --quiet || git commit -m "chore: update trending processed state [skip ci]"
          git push

      - name: Push archive to private repo
        env:
          ARCHIVE_REPO_TOKEN: ${{ secrets.ARCHIVE_REPO_TOKEN }}
        run: |
          if [ ! -d archive ] || [ -z "$(ls -A archive 2>/dev/null)" ]; then
            echo "No archive content to push, skipping."
            exit 0
          fi
          git clone "https://x-access-token:${ARCHIVE_REPO_TOKEN}@github.com/yyds/podcast-digest-archive.git" /tmp/archive-repo
          rsync -av --exclude='.git' archive/ /tmp/archive-repo/
          cd /tmp/archive-repo
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          if git diff --cached --quiet; then
            echo "No new archive files to commit."
          else
            git commit -m "archive: $(date -u +%Y-%m-%d) trending digest run"
            git push
            echo "Archive pushed successfully."
          fi
